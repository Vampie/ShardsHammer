<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Hammer Shards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hammer Shards</h1>
        <p class="shards"><span id="shards">0</span> <small>shards</small></p>
        <p class="per-click"><span id="clickRange">0</span> shards per click</p>
    </header>

    <main>
        <section class="collect">
            <button id="collectShardsButton">Collect Shards</button>
            <p id="message" role="status"></p>
        </section>

        <div class="shop">
            <section class="card hammer">
                <h2>Hammer</h2>
                <p class="owned"><span id="hammerCount">0</span> <small>owned</small></p>
                <p class="effect" id="hammerEffect"></p>
                <button id="createHammerButton">Buy for <span id="hammerCost">0</span></button>
            </section>

            <section class="card epic">
                <h2>Epic Hammer</h2>
                <p class="owned"><span id="hammerEpicCount">0</span> <small>owned</small></p>
                <p class="effect" id="epicEffect"></p>
                <button id="buyEpicHammerButton">Buy for <span id="hammerEpicCost">0</span></button>
            </section>

            <section class="card prestige">
                <h2>Prestige</h2>
                <p class="owned"><span id="prestigePoints">0</span> <small>points</small></p>
                <p class="effect" id="prestigeEffect"></p>
                <button id="prestigeButton">Prestige for +<span id="prestigeGain">0</span></button>
            </section>
        </div>

        <section class="card">
            <details>
                <summary>How it works</summary>
                <div id="info"></div>
            </details>
        </section>

        <section class="card">
            <details>
                <summary>Stats</summary>
                <table>
                    <thead>
                        <tr><td></td><th scope="col">This run</th><th scope="col">Lifetime</th></tr>
                    </thead>
                    <tbody id="statsBody"></tbody>
                </table>
            </details>
        </section>
    </main>

    <script src="HammerShard.js"></script>
    <script src="game.js"></script>
</body>
</html>
